name: Keep Repository Active

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          echo "Last automated update: $(date -u)" > last_update.txt

      - name: Commit and push changes
        run: |
          git config user.name "SajidSaleemKhattak"
          git config user.email "113522768+SajidSaleemKhattak@users.noreply.github.com"
          git add last_update.txt
          git commit -m "Automated keepalive commit $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
